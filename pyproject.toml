[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gr_cn"
version = "0.1.0"
description = "Genome rearrangement reconstruction via extended breakpoint graphs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Tal Ben-Yishay" },
    { name = "Ron Shamir" },
]
dependencies = [
    "ortools>=9.10",
    "networkx>=3.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "jinja2>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gr_cn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
