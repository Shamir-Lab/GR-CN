[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "gr_cn"
version = "0.1.0"
description = "Genome rearrangement reconstruction via extended breakpoint graphs"
requires-python = ">=3.10"
dependencies = [
    "ortools",
    "networkx",
    "pandas",
    "openpyxl",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gr_cn*"]
